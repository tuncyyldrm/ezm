<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Durum Stüdyosu Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>

    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app">
        <!-- SOL: Araçlar -->
        <div class="panel">
            <h2>🎨 Araçlar</h2>

            <div class="sec">
                <h3>📐 Arka Plan</h3>
                <input type="file" id="bgFile" accept="image/*" style="margin-bottom:6px;">
                <div class="row">
                    <select id="bgFit">
                        <option value="contain">Sığdır</option>
                        <option value="cover">Kapla</option>
                    </select>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
            </div>

            <div class="sec">
                <h3>➕ Katman Ekle</h3>
                <div class="row">
                    <button class="btn btn-s" onclick="addLayer('txt')">📝 Metin</button>
                    <button class="btn btn-s" onclick="addLayer('txt','🔥')">😀 Emoji</button>
                </div>
                <div class="row" style="margin-top:6px;">
                    <button class="btn btn-s" onclick="document.getElementById('imgFile').click()">🖼 Logo/Görsel</button>
                    <button class="btn btn-s" onclick="addDefaultLogo()">🏢 Varsayılan Logo</button>
                </div>
                <input type="file" id="imgFile" accept="image/*" style="display:none;">
                
                <div class="logo-preview">
                    <img src="https://erntysmhwfxkrtegirds.supabase.co/storage/v1/object/public/product-images/logo.png" 
                         alt="Varsayılan Logo" 
                         onerror="this.style.display='none'">
                </div>
            </div>

            <div class="sec" id="propBox">
                <h3>✏️ Özellikler <span class="badge" id="layerType">Seçili Yok</span></h3>
                <div id="txtProps" style="display:none;">
                    <textarea id="txtContent" rows="2" placeholder="Metin..."></textarea>
                    <div class="row" style="margin-top:6px;">
                        <select id="txtFont">
                            <option value="sans-serif">Sistem</option>
                            <option value="Impact">Impact</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Courier New">Mono</option>
                        </select>
                        <select id="txtAlign">
                            <option value="center">Orta</option>
                            <option value="left">Sol</option>
                            <option value="right">Sağ</option>
                        </select>
                    </div>
                    <div class="row" style="margin-top:6px;">
                        <div class="frm"><label>Boyut <span id="sv">20</span>px</label><input type="range" id="txtSize" min="8" max="80" value="20"></div>
                        <div class="frm"><label>Boşluk <span id="spv">0</span>px</label><input type="range" id="txtSpace" min="-3" max="15" value="0"></div>
                    </div>
                    <div class="row3" style="margin-top:6px;">
                        <input type="color" id="txtColor" value="#ffffff" title="Yazı Rengi">
                        <input type="color" id="txtBg" value="#000000" title="Kutu Rengi">
                        <select id="txtOpacity">
                            <option value="1">%100</option>
                            <option value="0.8" selected>%80</option>
                            <option value="0.5">%50</option>
                            <option value="0">%0</option>
                        </select>
                    </div>
                </div>
                <div id="imgProps" style="display:none;">
                    <div class="row">
                        <div class="frm"><label>Genişlik</label><input type="number" id="imgW" min="20" max="360" value="321"></div>
                        <div class="frm"><label>Yükseklik</label><input type="number" id="imgH" min="20" max="640" value="130"></div>
                    </div>
                </div>
                <div class="row" style="margin-top:8px;">
                    <button class="btn btn-s btn-sm" onclick="moveZ(1)">▲</button>
                    <button class="btn btn-s btn-sm" onclick="moveZ(-1)">▼</button>
                    <button class="btn btn-s btn-sm" onclick="dupLayer()">📋</button>
                    <button class="btn btn-d btn-sm" onclick="delLayer()">🗑</button>
                </div>
            </div>
        </div>
<!-- ORTA: Önizleme -->
<div class="panel" style="align-items:center;">
    <h2>📱 Önizleme</h2>
    <div class="preview-wrap">
        <!-- img etiketi silindi, her şey stage üzerinde birleşecek -->
        <div id="stage"></div>
    </div>
    <div id="info" style="font-size:0.7rem; color:var(--mut); margin-top:5px;">Tıkla → Sürükle → Düzenle → Paylaş</div>
</div>

        <!-- SAĞ: İşlemler -->
        <div class="panel">
            <h2>⚡ İşlemler</h2>

            <button class="btn btn-d btn-block" onclick="resetAll()">🔄 Sıfırla</button>
            <button class="btn btn-s btn-block" onclick="undo()">↩ Geri Al</button>
            <button class="btn btn-s btn-block" onclick="centerAll()">🎯 Ortala</button>

            <div class="sec" style="margin-top:6px;">
                <h3>💾 Dışa Aktar</h3>
<select id="quality">
    <option value="1">Standart (1x)</option>
    <option value="2" selected>Yüksek (2x)</option>
    <option value="3">Ultra Keskin (3x)</option>
</select>
                <button class="btn btn-p btn-block" onclick="exportImg('png')">💾 PNG Kaydet</button>
                <button class="btn btn-c btn-block" style="margin-top:6px;" onclick="exportImg('copy')">📋 Panoya Kopyala</button>
            </div>

            <div class="sec">
                <h3>📊 Katmanlar</h3>
                <div id="layerList"><div style="color:var(--mut); text-align:center; padding:10px;">Boş</div></div>
            </div>

            <div style="font-size:0.7rem; color:var(--mut); line-height:1.6;">
                <div><kbd>Delete</kbd> Sil <kbd>Ctrl+D</kbd> Kopyala <kbd>Ctrl+Z</kbd> Geri Al</div>
                <div><kbd>↑↓←→</kbd> Hareket <kbd>Shift+</kbd> Hızlı</div>
            </div>
        </div>
    </div>
    <script src="/script.js"></script>

</body>
</html>
